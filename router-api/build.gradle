plugins {
    alias(libs.plugins.android.library)
    id 'maven-publish'
}

android {
    namespace 'com.shanghaizhida.router'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        minSdk 29
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // 零第三方依赖架构：仅依赖 Android 平台 SDK (compileSdk 37) 与 Kotlin 标准库
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.bchstring-glitch.AouterMy'
                artifactId = 'router-api'
                version = (project.version != null && project.version != 'unspecified') ? project.version : '1.0.0'
            }
        }
    }
}
